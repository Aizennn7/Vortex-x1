name: Deploy dashboard

# Publishes apps/web to GitHub Pages (100% free-tier compatible).
#
# Supported secret-free browser data modes (no paid Render relay required):
#   1. Supabase Free read-only views (recommended): set repository variables
#      VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY. Migration 0007 enables RLS
#      on all tables, revokes base-table privileges from anon/authenticated, and
#      grants SELECT only on secret-free public_* views.
#   2. Build-time static snapshot: when DATABASE_URL is configured in repository
#      secrets, this workflow exports a redacted apps/web/public/snapshot.json
#      before building the bundle.
#   3. Optional self-hosted relay: set repository variable VITE_RELAY_URL.
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - supabase/functions/scan-trigger/**
      - docs/SCAN-TRIGGER-SETUP.md
      - packages/core/**
      - package.json
      - package-lock.json
      - scripts/assert-no-secrets-in-bundle.mjs
      - scripts/export-snapshot.ts
      - .github/workflows/pages.yml
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing.
concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || './' }}
      VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE }}
      VITE_SCAN_TRIGGER_URL: ${{ vars.VITE_SCAN_TRIGGER_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      VORTEX_SECRET_KEY: ${{ secrets.VORTEX_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Export static status snapshot when it is the selected data source
        if: env.VITE_RELAY_URL == '' && (env.VITE_SUPABASE_URL == '' || env.VITE_SUPABASE_ANON_KEY == '') && (env.DATABASE_URL != '' || env.DATABASE_URL_DIRECT != '')
        run: npm run snapshot:export

      - name: Select and verify dashboard data source configuration
        id: source
        run: |
          if [ -n "$VITE_RELAY_URL" ]; then
            echo "mode=relay" >> "$GITHUB_OUTPUT"
            echo "Relay origin configured: $VITE_RELAY_URL"
          elif [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "mode=supabase" >> "$GITHUB_OUTPUT"
            echo "Supabase public read-only view origin configured: $VITE_SUPABASE_URL"
          elif [ -f "apps/web/public/snapshot.json" ]; then
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
            echo "VITE_DATA_SOURCE=snapshot" >> "$GITHUB_ENV"
            echo "Using exported static status snapshot (./snapshot.json)"
          else
            echo "::error::No dashboard data source is configured."
            echo "Configure one of the free-tier options in Settings -> Secrets and variables -> Actions:"
            echo "  1. Variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (live read-only public_* views on Supabase Free), or"
            echo "  2. Secret DATABASE_URL (exports a sanitized static snapshot.json at build time), or"
            echo "  3. Variable VITE_RELAY_URL (optional self-hosted HTTP relay)."
            exit 1
          fi

      - name: Build
        run: npm run build:web

      - name: Bundle guard (no secrets, no privileged keys, no loopback API base)
        run: npm run guard:bundle

      - name: Assert the deployed bundle points at the configured origin
        if: steps.source.outputs.mode == 'relay' || steps.source.outputs.mode == 'supabase'
        run: |
          if [ "${{ steps.source.outputs.mode }}" = "relay" ]; then
            node scripts/assert-relay-base.mjs "$VITE_RELAY_URL"
          else
            node scripts/assert-relay-base.mjs "$VITE_SUPABASE_URL"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
