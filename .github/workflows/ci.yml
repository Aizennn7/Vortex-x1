name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Validate GitHub Actions workflows and migration safety
        run: npm run validate:workflows
      - name: Validate the database diagnostic without credentials
        run: npm run db:diagnose -- --config-only
      - name: "Fail closed on a relative database URL (regression: getaddrinfo base)"
        run: |
          set +e
          DATABASE_URL=base npm run db:diagnose -- --config-only > diagnostic.log 2>&1
          status=$?
          set -e
          cat diagnostic.log
          if [ "$status" -ne 2 ]; then
            echo "::error::Expected the diagnostic to exit 2 for a relative DATABASE_URL, got $status"
            exit 1
          fi
          grep -q "postgres://base" diagnostic.log
          if grep -qi "EAI_AGAIN" diagnostic.log; then
            echo "::error::The diagnostic attempted DNS instead of rejecting the value"
            exit 1
          fi
      - name: Unit and integration tests (embedded Postgres)
        run: npm test
      - name: Smoke test the full pipeline
        run: npm run smoke
        env:
          VORTEX_PROVIDER: simulated
      - name: Test the one-shot GitHub Actions job runner against embedded Postgres
        run: npm run job:run -- --job=all
        env:
          VORTEX_USE_EMBEDDED_DB: 'true'
          VORTEX_PROVIDER: simulated
          VORTEX_SECRET_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'
          TWELVEDATA_API_KEY: 'simulated-primary-key-0123456789'

  build:
    name: Build and guard the dashboard bundle
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the dashboard (Supabase public views mode)
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: https://supabase.invalid
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_fixture_anon
      - name: Verify the Supabase-mode bundle contains no secrets and points at Supabase origin
        run: |
          npm run guard:bundle
          node scripts/assert-relay-base.mjs https://supabase.invalid
      - name: Build the dashboard (Relay mode)
        run: npm run build:web
        env:
          VITE_RELAY_URL: https://relay.invalid
      - name: Verify the bundle contains no secrets and no loopback API base
        run: npm run guard:bundle
      - name: Verify the bundle points at the relay it was built for
        run: node scripts/assert-relay-base.mjs https://relay.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-web-ci-check
          path: apps/web/dist
          retention-days: 7
      - name: Fail if the deployed migrations drift from the source migrations
        run: |
          npm run db:sync-supabase
          git diff --exit-code -- supabase/migrations
