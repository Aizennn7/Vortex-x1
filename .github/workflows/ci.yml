name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Unit and integration tests (embedded Postgres)
        run: npm test
      - name: Smoke test the full pipeline
        run: npm run smoke
        env:
          VORTEX_PROVIDER: simulated

  build:
    name: Build and guard the dashboard bundle
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the dashboard the way the Pages workflow does
        run: npm run build:web
        env:
          # RFC 2606 reserved TLD: can never resolve, so this is a fixture and
          # not an invented production URL. The real value is the repository
          # variable VITE_RELAY_URL, supplied by the Pages workflow only.
          VITE_RELAY_URL: https://relay.invalid
      - name: Verify the bundle contains no secrets and no loopback API base
        run: npm run guard:bundle
      - name: Verify the bundle points at the relay it was built for
        run: node scripts/assert-relay-base.mjs https://relay.invalid
      - uses: actions/upload-artifact@v4
        with:
          # Named to make clear this is a build check, not a deployable site:
          # it carries the reserved-TLD fixture relay, never a real origin.
          name: vortex-web-ci-check
          path: apps/web/dist
          retention-days: 7
      - name: Fail if the deployed migrations drift from the source migrations
        run: |
          npm run db:sync-supabase
          git diff --exit-code -- supabase/migrations