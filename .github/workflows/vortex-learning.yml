name: Nightly Self-Learning

# Scheduled model training, walk-forward validation, strategy weight learning,
# and drift detection on GitHub Actions + Supabase Free.
#
# Runs once daily at 03:15 UTC (and on manual workflow_dispatch). Promoted
# models, candidate metrics, strategy weights, and drift reports are persisted
# in Supabase (`model_versions`, `learning_runs`, `strategy_weights`,
# `model_drift_reports`).
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortex-learning
  cancel-in-progress: false

jobs:
  train:
    name: Train and evaluate candidate model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      VORTEX_ROLE: worker
      VORTEX_WORKER_ID: gha-learning-${{ github.run_id }}-${{ github.run_attempt }}
      VORTEX_INSTANCE_LABEL: github-actions-learning
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      VORTEX_SECRET_KEY: ${{ secrets.VORTEX_SECRET_KEY }}
      VORTEX_ADMIN_TOKEN: ${{ secrets.VORTEX_ADMIN_TOKEN }}
      VORTEX_LEARNING_ENABLED: ${{ vars.VORTEX_LEARNING_ENABLED || 'true' }}
      VORTEX_TRAIN_MIN_SAMPLES: ${{ vars.VORTEX_TRAIN_MIN_SAMPLES || '200' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # These workflows invoke TypeScript CLIs provided by the root devDependency `tsx`.
      # NODE_ENV=production can make npm ci omit devDependencies, so include them explicitly.
      - run: npm ci --include=dev

      - name: Verify required secrets and inspect migration status
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error::DATABASE_URL (or DATABASE_URL_DIRECT) secret is not configured."
            exit 1
          fi
          if [ -z "$VORTEX_SECRET_KEY" ]; then
            echo "::error::VORTEX_SECRET_KEY secret is not configured."
            exit 1
          fi
          # Validate the URI before any network call. This fails closed with an
          # actionable message instead of `getaddrinfo EAI_AGAIN base`.
          npm run db:diagnose -- --config-only --require-configured
          # Keep scheduled workflows read-only with respect to schema changes.
          # Apply pending migrations deliberately after the connection/status checks are verified.
          npm run migrate:status

      - name: Run learning and maintenance jobs
        run: npm run job:run -- --job=learning,maintenance

      - name: Upload model artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-model-artifacts-${{ github.run_id }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 30
